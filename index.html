<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster - To-Do with Stats</title>
  <style>
    /* --- CSS Variables & Theming --- */
    :root {
      --bg-color: #F8F9FA;
      --text-color: #212529;
      --card-bg: #FFFFFF;
      --border-color: #DEE2E6;
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --danger-color: #dc3545;
      --success-color: #198754;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
      --border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      --bg-color: #212529;
      --text-color: #F9FAFB;
      --card-bg: #343A40;
      --border-color: #495057;
      --shadow: 0 4px 6px rgba(0,0,0,0.5);
    }

    /* --- Base Styles --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* --- Theme Toggle --- */
    .theme-toggle-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    /* --- Card Styles --- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    h1, h2, h3 {
      margin-bottom: 1rem;
    }

    /* --- Forms & Buttons --- */
    input, textarea, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.btn-danger { background-color: var(--danger-color); }
    button.btn-secondary { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
    button.btn-small { padding: 0.3rem 0.6rem; width: auto; font-size: 0.85rem; margin: 0; }

    /* --- Auth View --- */
    #auth-view {
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
    }

    .auth-error {
      color: var(--danger-color);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    /* --- Dashboard Header --- */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    /* --- Stats Section --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      text-align: center;
    }
    .stat-box {
      background: var(--bg-color);
      padding: 1rem;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary-color);
    }
    .stat-label {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    /* --- Task List --- */
    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1rem;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .task-item.completed {
      opacity: 0.6;
    }
    .task-item.completed .task-title {
      text-decoration: line-through;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .task-desc {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .task-meta {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .task-actions {
      display: flex;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <button id="theme-toggle" class="theme-toggle-btn">Toggle Dark Mode</button>

  <div class="container">
    
    <!-- AUTH VIEW -->
    <div id="auth-view" class="card">
      <h1>TaskMaster</h1>
      <p style="margin-bottom: 1.5rem;">Manage your tasks and track your productivity.</p>
      
      <div id="auth-error-msg" class="auth-error hidden"></div>
      
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="btn-login">Log In</button>
        <button type="button" id="btn-signup" class="btn-secondary">Sign Up</button>
      </form>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden">
      
      <div class="dashboard-header">
        <h2>Dashboard</h2>
        <div>
          <span id="user-email" style="margin-right: 1rem;"></span>
          <button id="btn-logout" class="btn-secondary btn-small">Log Out</button>
        </div>
      </div>

      <!-- Stats Section -->
      <div class="card">
        <h3>Your Statistics</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div id="stat-total" class="stat-value">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-box">
            <div id="stat-completed" class="stat-value">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-box">
            <div id="stat-percent" class="stat-value">0%</div>
            <div class="stat-label">Completion Rate</div>
          </div>
          <div class="stat-box">
            <div id="stat-logins" class="stat-value">0</div>
            <div class="stat-label">Total Logins</div>
          </div>
        </div>
        <p style="font-size: 0.8rem; text-align: center; margin-top: 1rem; opacity: 0.7;">
          Last active: <span id="stat-last-active">Never</span>
        </p>
      </div>

      <!-- Task Form -->
      <div class="card">
        <h3>Add New Task</h3>
        <form id="task-form">
          <input type="text" id="task-title" placeholder="Task Title" required>
          <textarea id="task-desc" placeholder="Task Description" rows="2"></textarea>
          <input type="date" id="task-date">
          <button type="submit">Add Task</button>
        </form>
      </div>

      <!-- Task List -->
      <div class="card">
        <h3>Your Tasks</h3>
        <div id="loading-tasks" style="text-align: center; margin-bottom: 1rem;">Loading tasks...</div>
        <ul id="task-list" class="task-list"></ul>
      </div>

    </div>
  </div>

  <script type="module">
    // -----------------------------------------------------------------
    // 1. SUPABASE INITIALIZATION
    // -----------------------------------------------------------------
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://ghlbxbgosklelqjmpwtc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eM1ZHCPG48ugG0fmWXICMQ_WAeEzlrz';

    let supabase = null;
    try {
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.warn("Supabase credentials not provided yet.");
      }
    } catch (err) {
      console.error("Failed to initialize Supabase:", err);
    }

    // -----------------------------------------------------------------
    // 2. STATE & DOM ELEMENTS
    // -----------------------------------------------------------------
    let currentUser = null;
    let tasks = [];

    // Views
    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    
    // Auth Elements
    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnSignup = document.getElementById('btn-signup');
    const btnLogout = document.getElementById('btn-logout');
    const authErrorMsg = document.getElementById('auth-error-msg');
    const userEmailDisplay = document.getElementById('user-email');

    // Task Elements
    const taskForm = document.getElementById('task-form');
    const taskTitleInput = document.getElementById('task-title');
    const taskDescInput = document.getElementById('task-desc');
    const taskDateInput = document.getElementById('task-date');
    const taskListEl = document.getElementById('task-list');
    const loadingTasksEl = document.getElementById('loading-tasks');

    // Stats Elements
    const statTotal = document.getElementById('stat-total');
    const statCompleted = document.getElementById('stat-completed');
    const statPercent = document.getElementById('stat-percent');
    const statLogins = document.getElementById('stat-logins');
    const statLastActive = document.getElementById('stat-last-active');

    // Theme Toggle
    const themeToggleBtn = document.getElementById('theme-toggle');

    // -----------------------------------------------------------------
    // 3. UI/UX: THEME & ROUTING
    // -----------------------------------------------------------------
    
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', currentTheme);
    });

    function showView(view) {
      if (view === 'auth') {
        authView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
      } else if (view === 'dashboard') {
        authView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
      }
    }

    function showError(msg) {
      authErrorMsg.textContent = msg;
      authErrorMsg.classList.remove('hidden');
    }

    // -----------------------------------------------------------------
    // 4. AUTHENTICATION & LOCAL STORAGE TRACKING
    // -----------------------------------------------------------------

    async function checkUser() {
      if (!supabase) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        handleUserLogin(session.user);
      } else {
        showView('auth');
      }
    }

    function handleUserLogin(user) {
      currentUser = user;
      userEmailDisplay.textContent = user.email;
      showView('dashboard');
      
      // Update Local Storage Stats
      trackLoginStats();
      updateLocalStatsDisplay();
      
      // Fetch Tasks
      fetchTasks();
    }

    function trackLoginStats() {
      let logins = parseInt(localStorage.getItem('total_logins') || '0');
      logins += 1;
      localStorage.setItem('total_logins', logins);
      
      const now = new Date().toLocaleString();
      localStorage.setItem('last_active_date', now);
    }

    function updateLocalStatsDisplay() {
      statLogins.textContent = localStorage.getItem('total_logins') || '0';
      statLastActive.textContent = localStorage.getItem('last_active_date') || 'Never';
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabase) return alert("Setup Supabase credentials first!");
      
      const email = emailInput.value;
      const password = passwordInput.value;
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        showError(error.message);
      } else {
        authErrorMsg.classList.add('hidden');
        handleUserLogin(data.user);
        authForm.reset();
      }
    });

    btnSignup.addEventListener('click', async () => {
      if (!supabase) return alert("Setup Supabase credentials first!");
      
      const email = emailInput.value;
      const password = passwordInput.value;
      
      if (!email || !password) return showError("Please enter email and password to sign up.");

      const { data, error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        showError(error.message);
      } else {
        alert("Sign up successful! Please log in (or check email for confirmation if enabled in Supabase).");
      }
    });

    btnLogout.addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (!error) {
        currentUser = null;
        tasks = [];
        showView('auth');
      }
    });

    // -----------------------------------------------------------------
    // 5. TASK MANAGEMENT (CRUD) & STATISTICS
    // -----------------------------------------------------------------

    function updateTaskStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.is_completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      statTotal.textContent = total;
      statCompleted.textContent = completed;
      statPercent.textContent = `${percent}%`;
    }

    async function fetchTasks() {
      loadingTasksEl.classList.remove('hidden');
      taskListEl.innerHTML = '';

      const { data, error } = await supabase
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: false });

      loadingTasksEl.classList.add('hidden');

      if (error) {
        console.error("Error fetching tasks:", error);
        return;
      }

      tasks = data || [];
      renderTasks();
      updateTaskStats();
    }

    function renderTasks() {
      taskListEl.innerHTML = '';
      
      if (tasks.length === 0) {
        taskListEl.innerHTML = '<li style="text-align: center; opacity: 0.6;">No tasks yet. Add one above!</li>';
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.is_completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <div class="task-content">
            <div class="task-title">${escapeHTML(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escapeHTML(task.description)}</div>` : ''}
            ${task.due_date ? `<div class="task-meta">Due: ${task.due_date}</div>` : ''}
          </div>
          <div class="task-actions">
            <button class="btn-small ${task.is_completed ? 'btn-secondary' : ''}" onclick="window.toggleTask('${task.id}', ${task.is_completed})">
              ${task.is_completed ? 'Undo' : 'Done'}
            </button>
            <button class="btn-danger btn-small" onclick="window.deleteTask('${task.id}')">Delete</button>
          </div>
        `;
        taskListEl.appendChild(li);
      });
    }

    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = taskTitleInput.value;
      const description = taskDescInput.value;
      const due_date = taskDateInput.value;

      const { data, error } = await supabase
        .from('tasks')
        .insert([{ 
          user_id: currentUser.id,
          title, 
          description, 
          due_date, 
          is_completed: false 
        }])
        .select();

      if (error) {
        alert("Error adding task: " + error.message);
      } else {
        taskForm.reset();
        tasks.unshift(data[0]);
        renderTasks();
        updateTaskStats();
      }
    });

    window.toggleTask = async (id, currentStatus) => {
      const newStatus = !currentStatus;
      
      const taskIndex = tasks.findIndex(t => t.id == id);
      if(taskIndex > -1) {
        tasks[taskIndex].is_completed = newStatus;
        renderTasks();
        updateTaskStats();
      }

      const { error } = await supabase
        .from('tasks')
        .update({ is_completed: newStatus })
        .eq('id', id);

      if (error) {
        console.error("Error updating task:", error);
        tasks[taskIndex].is_completed = currentStatus;
        renderTasks();
        updateTaskStats();
      }
    };

    window.deleteTask = async (id) => {
      if(!confirm("Are you sure you want to delete this task?")) return;

      const originalTasks = [...tasks];
      tasks = tasks.filter(t => t.id != id);
      renderTasks();
      updateTaskStats();

      const { error } = await supabase
        .from('tasks')
        .delete()
        .eq('id', id);

      if (error) {
        console.error("Error deleting task:", error);
        tasks = originalTasks;
        renderTasks();
        updateTaskStats();
      }
    };

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag]));
    }

    // -----------------------------------------------------------------
    // 6. INITIALIZATION
    // -----------------------------------------------------------------
    initTheme();
    checkUser();

  </script>
</body>
</html>
